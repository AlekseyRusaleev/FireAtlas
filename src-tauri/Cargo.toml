[package]
name = "fire-atlas"
version = "0.1.11"
description = "Пожарный Атлас — поиск ИППВ и информационных карточек"
authors = ["FireAtlas"]
edition = "2021"

[lib]
name = "fire_atlas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
walkdir = "2"
zip = "2"
quick-xml = "0.37"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
thiserror = "2"
parking_lot = "0.12"
open = { version = "5", features = ["shellexecute-on-windows"] }
ureq = { version = "2.12", features = ["json"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
